<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none';">
    <title>ZoyBlocks Cozmo</title>
    <link rel="stylesheet" href="home.css">
</head>

<body>
    <noscript>
        <div style="padding: 1rem; background: #ffdddd; color: #900;">
            Este aplicativo requer JavaScript habilitado para funcionar corretamente.
        </div>
    </noscript>

    <nav class="navbar navbar-expand-lg custom-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="../../../assets/imgs/logo_zoy.png" alt="Logo Zoy" class="logo-img" title="Zoy Blocks Cozmo v1.0.0">
            </a>

            <button class="btn btn-success py-2 me-3 my-auto" id="btnExecutarCodigo" title="Clique para executar o código">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                    class="bi bi-caret-right-fill" viewBox="0 0 16 16">
                    <path d="m12.14 8.753-5.482 4.796c-.646.566-1.658.106-1.658-.753V3.204a1 1 0 0 1 1.659-.753l5.48 4.796a1 1 0 0 1 0 1.506z" />
                </svg>
                EXECUTAR
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarMenu">
                <ul class="navbar-nav align-items-center gap-lg-3 gap-2">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle custom-link" href="#" role="button" data-bs-toggle="dropdown">
                            Arquivo
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#" id="salvarProjeto">Salvar Projeto</a></li>
                            <li><a class="dropdown-item" href="#" id="carregarProjeto">Carregar Projeto</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="btn custom-btn" href="#" id="ajuda-link">Ajuda</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="container">
        <div id="blocklyDiv">
            <button id="toggleSidebar" class="btn btn-secondary" title="Mostrar/Esconder Menu">
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 15a.5.5 0 0 1-.5-.5v-13a.5.5 0 0 1 1 0v13a.5.5 0 0 1-.5.5M.146 8.354a.5.5 0 0 1 0-.708l2-2a.5.5 0 1 1 .708.708L1.707 7.5H5.5a.5.5 0 0 1 0 1H1.707l1.147 1.146a.5.5 0 0 1-.708.708zM10 8a.5.5 0 0 1 .5-.5h3.793l-1.147-1.146a.5.5 0 0 1 .708-.708l2 2a.5.5 0 0 1 0 .708l-2 2a.5.5 0 0 1-.708-.708L14.293 8.5H10.5A.5.5 0 0 1 10 8" />
                </svg>
            </button>
        </div>

        <div id="sidebarRight" class="container-fluid">
            <div id="typeConnect">
                <div id="connectUSB">
                    <div class="row g-2">
                        <div class="col-12">
                            <button id="btnIniciarCozmo" class="btn btn-warning w-100 py-3 fw-bold">🚀 INICIAR COZMO</button>
                        </div>
                        
                        <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-4 mt-5">
                            <div id="statusToast" class="toast align-items-center text-bg-light border-0 p-2 w-auto" role="alert">
                                <div class="d-flex align-items-center justify-content-center">
                                    <div id="statusToastIcon" class="me-2"></div>
                                    <div id="statusToastMensagem" class="fw-semibold"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="carouselZoy" class="carousel slide text-center mt-3">
                <div class="carousel-inner" id="carouselInner">
                    </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselZoy" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselZoy" data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>
            </div>

            <div class="mt-3">
                <h6 class="text-muted">Visualização do Código</h6>
                <pre id="areaCodigo"># O código JavaScript será gerado aqui</pre>
            </div>

            <div class="mt-3">
                <div class="terminal-header">
                    <h6 class="text-muted">Logs do Robô</h6>
                    <div id="terminal"></div>
                    <div class="terminal-controles">
                        <button class="btn btn-sm btn-danger w-100" id="limparTerminalBtn">Limpar Terminal</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <xml id="toolbox" style="display: none">


        <category name="Luzes" colour="#cf63cf">
            <block type="cozmo_set_lights">
                <field name="COLOR">red</field> </block>
            <block type="cozmo_blink_lights">
                <value name="TIMES">
                     <shadow type="math_number"><field name="NUM">3</field></shadow>
                </value>
             </block>
        </category>



        <category name="Movimentos" colour="#5b67a5">
            <block type="cozmo_forward">
                <value name="SPEED">
                    <shadow type="math_number"><field name="NUM">50</field></shadow>
                </value>
                <value name="DURATION">
                    <shadow type="math_number"><field name="NUM">1</field></shadow>
                </value>
            </block>
            <block type="cozmo_turn"></block>
            <block type="cozmo_stop"></block>
            <block type="cozmo_lift"> <field name="HEIGHT">0</field> </block>
            <block type="cozmo_head"> <field name="ANGLE">0</field>  </block>
            <block type="cozmo_expression"><field name="EMOTION">HAPPY</field></block>

        </category>
        <category name="Lógica" colour="#5b80a5">
            <block type="controls_repeat_ext">
                <value name="TIMES">
                    <shadow type="math_number"><field name="NUM">10</field></shadow>
                </value>
            </block>
            <block type="math_number"></block>

        </category>
        </category>

    <sep></sep> <category name="Lógica" colour="#5b80a5">
        <block type="controls_if"></block>
        <block type="logic_compare"></block>
        <block type="logic_operation"></block>
        <block type="logic_negate"></block>
        <block type="logic_boolean"></block>
    </category>
    <category name="Matemática" colour="#5b67a5">
        <block type="math_number"></block>
        <block type="math_arithmetic"></block>
        <block type="math_single"></block>
    </category>
    <category name="Loops" colour="#5ba55b">
        <block type="controls_repeat_ext">
            <value name="TIMES">
                <shadow type="math_number"><field name="NUM">10</field></shadow>
            </value>
        </block>
        <block type="controls_whileUntil"></block>
        <block type="controls_for">
            <value name="FROM">
                <shadow type="math_number"><field name="NUM">1</field></shadow>
            </value>
            <value name="TO">
                <shadow type="math_number"><field name="NUM">10</field></shadow>
            </value>
            <value name="BY">
                <shadow type="math_number"><field name="NUM">1</field></shadow>
            </value>
        </block>
    </category>

    <category name="Variáveis" colour="#a55b80" custom="VARIABLE"></category>
    <category name="Funções" colour="#995ba5" custom="PROCEDURE"></category>
    </xml>

    <script src="home.js"></script>
</body>
</html>
